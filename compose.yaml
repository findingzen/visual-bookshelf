# visual-bookshelf development stack.
# Runs unchanged under `podman compose` and `docker compose` (ADR 0006).
# Copy .env.example to .env before the first `up`.

name: visual-bookshelf

services:
  caddy:
    image: docker.io/library/caddy:2
    depends_on:
      - web
    environment:
      VB_SITE_HOST: ${VB_SITE_HOST}
      VB_HTTPS_PORT: ${VB_HTTPS_PORT}
      VB_HTTP_PORT: ${VB_HTTP_PORT}
    # Container ports match the host ports so Caddy's redirects and
    # certificates use the port the browser actually sees.
    ports:
      - "${VB_BIND_ADDRESS}:${VB_HTTPS_PORT}:${VB_HTTPS_PORT}"
      - "${VB_BIND_ADDRESS}:${VB_HTTP_PORT}:${VB_HTTP_PORT}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  web:
    build: ./app
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Not published to the host.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  caddy_data:
  caddy_config:
